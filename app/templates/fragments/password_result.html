{% if password %}
<div class="panel tight" style="margin-top:14px">
  <div class="flash ok">Новый пароль для <b>{{ username }}</b> (сообщите ему лично):</div>
  <div class="code" id="newpw-raw">{{ password }}</div>
  <div class="btnrow" style="margin-top:10px">
    <button class="btn sm copy" data-copy="#newpw-raw" type="button">Скопировать</button>
  </div>
</div>
{% elif err %}
<div class="err-box">{{ err }}</div>
{% endif %}
